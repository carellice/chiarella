# Pubblica la versione web su GitHub Pages: il contenuto di web/ più i suoni dell'app Android.
name: Versione web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/src/main/res/raw/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito
        run: |
          mkdir -p site/sounds
          cp -r web/. site/
          cp app/src/main/res/raw/*.ogg site/sounds/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
